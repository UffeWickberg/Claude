<title>Ackordhimlen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: one night sky fills the screen; the chord you hear floats in it as huge italic type;
   a lead-sheet strip, a keyboard and the controls sit on a glass shelf at the lake's edge.
   Single dark look by choice: it is a night sky. */
:root {
  color-scheme: dark;
  --night: #040a18;
  --ink: #eaf1ff;
  --mist: #a3b5d6;
  --shelf: rgba(6, 14, 32, .66);
  --line: rgba(170, 200, 255, .22);
  --glow: #86f3c4;
  --warn: #ffb9a6;
  --key-white: #dfe8fa;
  --key-black: #1b2644;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --text: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --c: var(--glow);
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font: 400 15px/1.5 var(--text); }
*, *::before, *::after { box-sizing: border-box; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.app {
  position: relative; z-index: 1; min-height: 100%;
  max-width: 1080px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 16px;
  padding-block: 22px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
.mark { font: 400 26px/1 var(--display); letter-spacing: .01em; margin: 0; }
.tag { margin: 0; color: var(--mist); }

.now { flex: 1; min-height: 190px; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; }
.nowSub { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--mist); }
.nowBig {
  font: italic 400 clamp(64px, 15vw, 176px)/.92 var(--display); letter-spacing: -.02em;
  overflow-wrap: anywhere; text-shadow: 0 2px 30px rgba(2, 6, 18, .8), 0 0 70px color-mix(in srgb, var(--c) 55%, transparent);
  transition: text-shadow .6s;
}
.mood { margin: 0; max-width: 46ch; font: italic 400 clamp(18px, 2.4vw, 23px)/1.3 var(--display); color: var(--ink); text-shadow: 0 1px 12px rgba(2, 6, 18, .9); text-wrap: balance; }

.shelf {
  display: grid; gap: 14px; min-width: 0;
  padding: 18px; border: 1px solid var(--line); border-radius: 18px;
  background: var(--shelf); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.entry { display: grid; gap: 6px; margin: 0; }
.entry label, .lab { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--mist); }
.row { display: flex; gap: 12px; align-items: center; }
#chords {
  flex: 1; min-width: 0; padding: 6px 0 8px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  background: transparent; color: var(--ink); font: 500 clamp(20px, 3.2vw, 28px)/1.2 var(--text); letter-spacing: .01em;
}
#chords:focus { outline: none; border-bottom-color: var(--glow); }
#chords::placeholder { color: var(--mist); opacity: .6; }
#play {
  flex: none; padding: 12px 24px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--glow); color: #04121a; font: 600 16px/1 var(--text);
  box-shadow: 0 0 28px color-mix(in srgb, var(--glow) 45%, transparent);
}
#play:disabled { opacity: .4; cursor: default; box-shadow: none; }
.hint { margin: 0; font-size: 13px; color: var(--mist); }
.hint.warn { color: var(--warn); }

/* Lead sheet: bar lines, chord symbols on top, scale degrees under. */
.sheet { display: flex; flex-wrap: wrap; row-gap: 10px; min-width: 0; }
.bar { display: flex; flex: 0 1 auto; min-width: 84px; padding: 0 6px; border-left: 1px solid var(--line); }
.bar:last-child { border-right: 4px double var(--line); }
.ch {
  flex: 1; display: grid; gap: 1px; padding: 5px 10px 6px; border: 0; border-radius: 8px;
  background: transparent; color: var(--ink); text-align: left; cursor: pointer; font: inherit;
  transition: background .25s, box-shadow .25s;
}
.ch b { font: 400 26px/1.1 var(--display); white-space: nowrap; }
.ch i { font: 500 12px/1.2 var(--text); font-style: normal; letter-spacing: .05em; color: var(--mist); white-space: nowrap; }
.ch:hover { background: rgba(170, 200, 255, .08); }
.ch.on { background: color-mix(in srgb, var(--c) 20%, transparent); box-shadow: inset 0 -2px 0 var(--c); }
.ch.on b { color: var(--c); }
.ch.bad { cursor: default; }
.ch.bad b { color: var(--warn); text-decoration: line-through; }

#piano { display: block; width: 100%; height: 46px; }
#piano .wk { fill: var(--key-white); stroke: var(--night); stroke-width: .6; transition: fill .2s; }
#piano .bk { fill: var(--key-black); stroke: var(--night); stroke-width: .6; transition: fill .2s; }
#piano .lit { fill: var(--c); }
#piano .mel { fill: #ffffff; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 26px; }
.seg { display: flex; align-items: center; gap: 10px; border: 0; padding: 0; margin: 0; min-width: 0; }
.seg legend { float: left; padding: 0; margin-right: 10px; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; font-weight: 500; }
.seg input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--night); }
.seg input:focus-visible + span, button:focus-visible, #tempo:focus-visible, #melody:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.tempo { display: flex; align-items: center; gap: 10px; }
#tempo { width: 140px; accent-color: var(--glow); }
#tempoOut { font-variant-numeric: tabular-nums; min-width: 9ch; color: var(--mist); }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
#melody { width: 17px; height: 17px; accent-color: var(--glow); margin: 0; }

.examples { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.examples button { padding: 2px 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font: inherit; cursor: pointer; }
.examples button:hover { border-bottom-color: var(--glow); color: var(--glow); }
.share { margin: 0; font-size: 13px; color: var(--mist); }

@media (max-width: 520px) {
  .shelf { padding: 14px; }
  .row { flex-wrap: wrap; }
  #chords { flex-basis: 100%; }
  #play { width: 100%; }
  .ch b { font-size: 22px; }
  .bar { min-width: 68px; }
}
@media (prefers-reduced-motion: reduce) { .ch, .nowBig, #piano .wk, #piano .bk { transition: none; } }
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <h1 class="mark">Ackordhimlen</h1>
    <p class="tag">Skriv ackord. Få tillbaka ett norrsken som spelar dem.</p>
  </header>

  <section class="now">
    <div class="nowSub" id="nowSub">Tonart</div>
    <div class="nowBig" id="now">a-moll</div>
    <p class="mood" id="mood"></p>
  </section>

  <section class="shelf">
    <form class="entry" id="form">
      <label for="chords">Dina ackord</label>
      <div class="row">
        <input id="chords" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Am F C G" aria-describedby="hint">
        <button id="play" type="submit">Spela</button>
      </div>
      <p class="hint" id="hint"></p>
    </form>

    <div class="sheet" id="sheet" aria-label="Takter"></div>
    <svg id="piano" preserveAspectRatio="none" aria-hidden="true"></svg>

    <div class="controls">
      <fieldset class="seg">
        <legend class="lab">Stil</legend>
        <label><input type="radio" name="style" id="style0" value="0" checked><span>Dröm</span></label>
        <label><input type="radio" name="style" id="style1" value="1"><span>Visa</span></label>
        <label><input type="radio" name="style" id="style2" value="2"><span>Puls</span></label>
      </fieldset>
      <div class="tempo">
        <label class="lab" for="tempo">Tempo</label>
        <input id="tempo" type="range" min="50" max="150" step="1" value="84">
        <output id="tempoOut" for="tempo">84 slag/min</output>
      </div>
      <label class="check" for="melody"><input id="melody" type="checkbox" checked> Dikta en melodi</label>
    </div>

    <div class="examples" id="examples"><span class="lab">Prova</span></div>
    <p class="share">Ackorden sparas i sidans adress. Dela sidan, så hör mottagaren samma himmel.</p>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── Music theory ───────── */
const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11, H: 11 };
const SV_MAJ = ['C', 'Dess', 'D', 'Ess', 'E', 'F', 'Fiss', 'G', 'Ass', 'A', 'B', 'H'];
const SV_MIN = ['c', 'ciss', 'd', 'ess', 'e', 'f', 'fiss', 'g', 'giss', 'a', 'b', 'h'];
const RN_MAJ = ['I', '♭II', 'II', '♭III', 'III', 'IV', '♯IV', 'V', '♭VI', 'VI', '♭VII', 'VII'];
const RN_MIN = ['I', '♭II', 'II', 'III', '♯III', 'IV', '♯IV', 'V', 'VI', '♯VI', 'VII', '♯VII'];
const SC_MAJ = [0, 2, 4, 5, 7, 9, 11], SC_MIN = [0, 2, 3, 5, 7, 8, 10];

function parseNote(s) {
  const m = /^([A-Ha-h])([#b]?)$/.exec(s);
  if (!m) return null;
  const L = m[1].toUpperCase() === 'H' ? 'B' : m[1].toUpperCase();
  return { pc: (NOTE[L] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12, txt: L + m[2] };
}

function parseChord(raw) {
  const s = raw.replace(/♯/g, '#').replace(/♭/g, 'b').replace(/[()\s]/g, '');
  const m = /^([A-Ha-h])([#b]?)(.*)$/.exec(s);
  if (!m) return null;
  const root = parseNote(m[1] + m[2]);
  let q = m[3], bass = null;
  const sl = q.lastIndexOf('/');
  if (sl >= 0) {
    const b = parseNote(q.slice(sl + 1));
    if (b) { bass = b; q = q.slice(0, sl); } else q = q.replace('/', '');
  }
  const qTxt = q;
  const eat = re => { const r = re.exec(q); if (r) { q = q.slice(r[0].length); return r; } return null; };
  let third = 4, fifth = 7, seventh = null, majMark = false, dim = false;
  const adds = [];
  if (eat(/^(mMaj|mmaj|minmaj|mM|mΔ)/)) { third = 3; majMark = true; seventh = 11; }
  else if (eat(/^(maj|Maj|MAJ|M|Δ|\^)/)) majMark = true;
  else if (eat(/^(ø|Ø)/)) { third = 3; fifth = 6; seventh = 10; }
  else if (eat(/^(dim|°|o(?=7|$))/)) { third = 3; fifth = 6; dim = true; }
  else if (eat(/^(aug|\+)/)) fifth = 8;
  else if (eat(/^(min|mi(?![a-z])|m|-)/)) third = 3;
  const num = eat(/^(69|6|7|9|11|13|5)/);
  if (num) {
    const n = num[1], sev = majMark ? 11 : dim ? 9 : 10;
    if (n === '5') third = null;
    else if (n === '6') adds.push(9);
    else if (n === '69') adds.push(9, 14);
    else { seventh = sev; if (n !== '7') adds.push(14); if (n === '11') adds.push(17); if (n === '13') adds.push(21); }
  }
  let r;
  while (q && (r = eat(/^(sus2|sus4|sus|add9|add2|add11|add4|add13|add6|b5|#5|b9|#9|#11|b13|maj7|M7|7)/))) {
    switch (r[1]) {
      case 'sus2': third = 2; break;
      case 'sus4': case 'sus': third = 5; break;
      case 'add9': case 'add2': adds.push(14); break;
      case 'add11': case 'add4': adds.push(17); break;
      case 'add13': case 'add6': adds.push(21); break;
      case 'b5': fifth = 6; break;
      case '#5': fifth = 8; break;
      case 'b9': adds.push(13); break;
      case '#9': adds.push(15); break;
      case '#11': adds.push(18); break;
      case 'b13': adds.push(20); break;
      case 'maj7': case 'M7': seventh = 11; break;
      case '7': seventh = 10; break;
    }
  }
  if (q) return null;
  const ivs = [0];
  if (third != null) ivs.push(third);
  ivs.push(fifth);
  if (seventh != null) ivs.push(seventh);
  adds.forEach(a => { if (!ivs.includes(a)) ivs.push(a); });

  const pretty = t => t.replace(/#/g, '♯').replace(/b(?=\d)/g, '♭');
  const noteTxt = n => n.txt[0] + (n.txt[1] === '#' ? '♯' : n.txt[1] === 'b' ? '♭' : '');
  const name = noteTxt(root) + pretty(qTxt) + (bass ? '/' + noteTxt(bass) : '');
  const encQ = qTxt.replace(/Δ|\^/g, 'maj').replace(/°/g, 'dim').replace(/ø|Ø/g, 'm7b5').replace(/\+/g, 'aug')
    .replace(/^-/, 'm').replace(/^M(?!aj)/, 'maj').replace(/^Maj|^MAJ/, 'maj').replace(/M7/g, 'maj7').replace(/#/g, 'x').replace(/[^A-Za-z0-9]/g, '');
  const encN = n => n.txt.replace('#', 'x');
  const code = encN(root) + encQ + (bass ? 'z' + encN(bass) : '');

  // Voicing: every pitch class has one home in a fixed octave window, which gives smooth voice leading for free.
  const place = (pc, lo) => lo + (((pc - lo) % 12) + 12) % 12;
  const notes = [...new Set(ivs.map(i => place(root.pc + i, i >= 13 ? 66 : 54)))].sort((a, b) => a - b);
  const bassMidi = place(bass ? bass.pc : root.pc, 36);
  let fifthBass = bass ? place(root.pc, 36) : bassMidi + fifth;
  if (fifthBass > 48) fifthBass -= 12;

  const minor = third === 3;
  const hue = (150 + (((minor ? root.pc + 3 : root.pc) * 7) % 12) * 30) % 360;
  return {
    root: root.pc, third, fifth, seventh, ivs, name, code, notes, bass: bassMidi, fifthBass, minor,
    hue, low: hsl(hue + (minor ? -8 : 0), .85, minor ? .58 : .62), top: hsl(hue + (minor ? 100 : 55), .8, .62),
    css: `hsl(${hue} 88% 72%)`
  };
}

function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360;
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return [f(0), f(8), f(4)];
}

function detectKey(chs) {
  let best = { tonic: 0, minor: false, score: -1e9 };
  for (let tonic = 0; tonic < 12; tonic++) for (const minor of [false, true]) {
    const sc = (minor ? SC_MIN : SC_MAJ).map(x => (x + tonic) % 12);
    let score = 0;
    chs.forEach((c, j) => {
      const tri = [c.root, c.root + (c.third ?? 0), c.root + c.fifth].map(x => x % 12);
      const out = tri.filter(p => !sc.includes(p)).length;
      if (!out) score += 2;
      else if (minor && c.root === (tonic + 7) % 12 && c.third === 4) score += 1.8;
      else score -= out * .7;
      if (c.root === tonic && (c.third === 3) === minor) score += 1 + (j === 0 ? 1.5 : 0) + (j === chs.length - 1 ? 1 : 0);
    });
    if (score > best.score) best = { tonic, minor, score };
  }
  best.scale = (best.minor ? SC_MIN : SC_MAJ).map(x => (x + best.tonic) % 12);
  best.label = (best.minor ? SV_MIN : SV_MAJ)[best.tonic] + (best.minor ? '-moll' : '-dur');
  return best;
}

function roman(c, key) {
  let r = (key.minor ? RN_MIN : RN_MAJ)[(c.root - key.tonic + 12) % 12];
  if (c.third === 3) r = r.toLowerCase();
  let suf = '';
  if (c.third === 3 && c.fifth === 6) suf = c.seventh === 10 ? 'ø7' : c.seventh === 9 ? '°7' : '°';
  else {
    if (c.fifth === 8 && c.third === 4) suf = '+';
    if (c.seventh === 11) suf += 'maj7'; else if (c.seventh === 10) suf += '7';
    else if (c.third === 2 || c.third === 5) suf += 'sus';
  }
  return r + suf;
}

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const segOf = (bar, s) => Math.min(bar.length - 1, Math.floor(s * bar.length / 16));

// A melody is diktad from the chords: chord tones on strong beats, scale steps between. Seeded, so a shared link sings the same tune.
function buildMelody(bars, key, sig) {
  const rnd = mulberry(hashStr(sig));
  const R = [[0, 2, 4, 6], [0, 3, 4, 6], [0, 2, 3, 4, 7], [0, 4, 6], [0, 1, 2, 4, 6], [0, 3, 6], [0, 2, 4, 5, 6]];
  const A = R[rnd() * R.length | 0], B = R[rnd() * R.length | 0];
  let prev = 72;
  return bars.map((bar, bi) => {
    const rh = bars.length > 1 && bi === bars.length - 1 ? [0, 4] : bi % 4 === 3 ? [0, 2, 4] : bi % 2 ? B : A;
    return rh.map((e, k) => {
      const c = bar[segOf(bar, e * 2)];
      const tones = c.ivs.filter(i => i < 12).map(i => (c.root + i) % 12);
      let n = prev;
      if (e % 4 === 0) {
        let cands = [];
        for (let w = 5; w <= 12 && !cands.length; w += 4)
          for (let x = prev - w; x <= prev + w; x++) if (x >= 64 && x <= 84 && tones.includes(x % 12)) cands.push(x);
        if (cands.length > 1 && rnd() < .7) cands = cands.filter(x => x !== prev);
        n = cands.length ? cands[rnd() * cands.length | 0] : 72;
      } else {
        const foreign = tones.filter(p => !key.scale.includes(p));
        const ok = p => tones.includes(p) || (key.scale.includes(p) && !foreign.some(f => (p - f + 12) % 12 === 1 || (f - p + 12) % 12 === 1));
        const dir = prev > 80 ? -1 : prev < 67 ? 1 : rnd() < .5 ? -1 : 1;
        const steps = rnd() < .25 ? 2 : 1;
        for (let st = 0; st < steps; st++) { let g = 0; do { n += dir; g++; } while (!ok(((n % 12) + 12) % 12) && g < 5); }
        n = Math.max(62, Math.min(86, n));
      }
      prev = n;
      return { e, midi: n, dur: (rh[k + 1] ?? 8) - e };
    });
  });
}

/* ───────── Song state ───────── */
let song = { bars: [], flat: [], key: null, melody: [], code: '' };
let bpm = 84, style = 0, melodyOn = true;

function readSong(text) {
  let groups;
  const toks = s => s.replace(/[-–—](?=[A-H])/g, ' ').split(/[\s,;]+/).filter(t => t && !/^[-–—>%.]+$/.test(t));
  if (text.includes('|')) groups = text.split('|').map(toks).filter(g => g.length).map(g => g.slice(0, 4));
  else groups = toks(text).map(t => [t]);
  groups = groups.slice(0, 32);
  const shown = groups.map(g => g.map(raw => ({ raw, ch: parseChord(raw) })));
  const bars = shown.map(g => g.filter(x => x.ch).map(x => x.ch)).filter(b => b.length);
  const flat = bars.flat();
  flat.forEach((c, i) => { c.idx = i; c.cx = flat.length === 1 ? .5 : .1 + .8 * i / (flat.length - 1); });
  const code = bars.map(b => b.map(c => c.code).join('q')).join('-');
  const key = flat.length ? detectKey(flat) : null;
  song = { bars, flat, key, code, shown, bad: shown.flat().filter(x => !x.ch).map(x => x.raw), melody: key ? buildMelody(bars, key, code) : [] };
  energy = flat.map((_, i) => energy[i] ?? .5);
  energy.length = flat.length;
  renderSheet();
  renderMeta();
  if (!playing) showRest();
}

function moodText() {
  const { flat, key, code } = song;
  const pick = a => a[hashStr(code) % a.length];
  let t = key.minor
    ? pick(['Vemodigt, som skymning över en stilla sjö.', 'Blått och eftertänksamt, som första snön i november.', 'Mörkt men varmt, som ett tänt fönster långt bort.'])
    : pick(['Ljust och öppet, som en junimorgon utan moln.', 'Varmt och hemtamt, som ett kök där någon nynnar.', 'Hoppfullt, som isen som släpper i april.']);
  const sevenths = flat.filter(c => c.seventh != null || c.ivs.some(i => i > 12)).length / flat.length;
  const borrowed = flat.filter(c => [c.root, c.root + (c.third ?? 0), c.root + c.fifth].some(p => !key.scale.includes(p % 12))).length;
  if (sevenths >= .5) t += ' Färgackorden lägger sammet i kanterna.';
  if (borrowed) t += borrowed > 1 ? ' Lånade ackord får himlen att skifta färg.' : ' Ett lånat ackord får himlen att skifta färg.';
  return t;
}

const sheet = $('#sheet');
function renderSheet() {
  sheet.textContent = '';
  song.shown.forEach(g => {
    const bar = document.createElement('div'); bar.className = 'bar';
    g.forEach(x => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'ch';
      const n = document.createElement('b'), d = document.createElement('i');
      if (x.ch) {
        n.textContent = x.ch.name; d.textContent = roman(x.ch, song.key);
        b.style.setProperty('--c', x.ch.css); x.ch.el = b;
        b.addEventListener('click', () => preview(x.ch));
        b.setAttribute('aria-label', `${x.ch.name}, steg ${d.textContent}. Lyssna.`);
      } else { n.textContent = x.raw; d.textContent = '?'; b.classList.add('bad'); b.disabled = true; }

function saveHash() {
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    const h = encodeState();
    if (h && h !== lastHash) { lastHash = h; try { location.hash = h; } catch (e) {} }
  }, 500);
}
function syncControls() {
  $('#tempo').value = bpm; $('#tempoOut').textContent = bpm + ' slag/min';
  $('#style' + style).checked = true; $('#melody').checked = melodyOn;
  if (G) { G.dl.delayTime.setTargetAtTime(60 / bpm * .75, ctx.currentTime, .05); G.pad.gain.cancelScheduledValues(ctx.currentTime); G.pad.gain.setValueAtTime(1, ctx.currentTime); }
}
function load(text) { input.value = text; syncControls(); readSong(text); }
function loadFromHash() {
  let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (!h || h === lastHash) return false;
  const text = decodeState(h); if (!text) return false;
  lastHash = h; load(text); return true;
}

/* ───────── Wiring ───────── */
const input = $('#chords');
input.addEventListener('input', () => { readSong(input.value); saveHash(); });
$('#form').addEventListener('submit', e => { e.preventDefault(); playing ? stop() : start(); });
$('#tempo').addEventListener('input', e => { bpm = +e.target.value; syncControls(); saveHash(); });
document.querySelectorAll('input[name="style"]').forEach(r => r.addEventListener('change', () => { style = +r.value; syncControls(); saveHash(); }));
$('#melody').addEventListener('change', e => { melodyOn = e.target.checked; saveHash(); });

const EXAMPLES = [
  ['Skymning', 'Am7 Fmaj7 Cadd9 G/B', 84, 0],
  ['Fyra ackord', 'C G Am F', 100, 2],
  ['Jazzkväll', 'Dm9 G13 Cmaj9 A7b9', 92, 1],
  ['Kanon', 'D A Bm F#m G D G A', 76, 1],
  ['Andalusisk', 'Am G F E', 112, 2],
  ['Sommarvisa', '| G D/F# | Em | C G/B | Am7 D7 |', 88, 1],
  ['Vinternatt', 'Hm G D A/C# Em G F#sus4 F#', 70, 0]
];
EXAMPLES.forEach(([label, text, t, s]) => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
  b.addEventListener('click', () => { bpm = t; style = s; load(text); saveHash(); if (!playing) start(); });
  $('#examples').append(b);
});

window.addEventListener('resize', resize);
window.addEventListener('hashchange', loadFromHash);
resize();
if (!loadFromHash()) load(EXAMPLES[0][1]);
requestAnimationFrame(frame);
})();
</script>
